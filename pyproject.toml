[project]
name = "hfagent"
version = "0.1.0"
description = "A terminal coding agent in the spirit of opencode, powered by Hugging Face Inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hfagent = "hfagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
