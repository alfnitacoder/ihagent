[project]
name = "hfagent"
version = "0.4.0"
description = "IHAgent — InnovatelHub Solutions Ltd. A terminal coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "rich>=13.0",
    "textual>=8.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.49"]
iheye = [
  "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=11.0; sys_platform == 'darwin'",
]
desktop = [
  "pyautogui>=0.9.54",
  "pynput>=1.7.7",
  "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11.0; sys_platform == 'darwin'",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "PySide6>=6.6; sys_platform != 'darwin'",
]

[project.scripts]
hfagent = "hfagent.cli:main"
ihagent = "hfagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfagent"]

[tool.hatch.build.targets.wheel.force-include]
"src/hfagent/builtin_skills" = "hfagent/builtin_skills"
"src/hfagent/iheye/assets/frame.png" = "hfagent/iheye/assets/frame.png"
"src/hfagent/iheye/assets/iris.png" = "hfagent/iheye/assets/iris.png"
"src/hfagent/iheye/assets/layout.json" = "hfagent/iheye/assets/layout.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pytest 9's import mode does not put the project root on sys.path, and the
# suite imports helpers as ``tests.test_agent``.
pythonpath = ["."]
